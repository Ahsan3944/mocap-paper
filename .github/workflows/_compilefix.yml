name: temporary-compile-fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Paper 1.21.11 API references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main/java/com/ultraop/mocap/recording/NonPlayerEntityData.java')
          s = p.read_text()
          s = s.replace('net.minecraft.world.entity.vehicle.AbstractMinecart minecart', 'org.bukkit.entity.Minecart minecart')
          s = s.replace('Object handle = ((CraftEntity) minecart).getHandle();\n            putInt(data, "int1", handle, "getHurtTime");', 'Object handle = ((CraftEntity) minecart).getHandle();\n            putInt(data, "int1", handle, "getHurtTime");')
          s = s.replace('Object handle = ((CraftEntity) minecart).getHandle();\n                setInt(handle, "setHurtTime", data, "int1");', 'Object handle = ((CraftEntity) minecart).getHandle();\n                setInt(handle, "setHurtTime", data, "int1");')
          s = s.replace('horse.getInventory().setSaddle(saddled ? org.bukkit.Material.SADDLE.createItemStack() : null);', 'if (saddled) horse.getInventory().setSaddle(new org.bukkit.inventory.ItemStack(org.bukkit.Material.SADDLE));\n            else horse.getInventory().setSaddle(null);')
          p.write_text(s)
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/_compilefix.yml
          git add src/main/java/com/ultraop/mocap/recording/NonPlayerEntityData.java .github/workflows/_compilefix.yml
          git commit -m 'Fix Paper 1.21.11 compile errors' || exit 0
          git push
