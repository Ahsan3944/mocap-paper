name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply temporary particle parity patch
        if: github.event_name == 'push' && github.actor == 'Ahsan3944'
        run: python3 .github/particle_patch.py

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build
        run: gradle build --no-daemon

      - name: Commit parity patch and cleanup
        if: github.event_name == 'push' && github.actor == 'Ahsan3944'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/particle_patch.py .particle-parity-trigger
          git add -A
          git commit -m "Align effect particle state parity" || exit 0
          git push
